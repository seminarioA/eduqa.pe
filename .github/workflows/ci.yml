name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commits:
    name: Validar mensajes de commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: commitlint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          git log --format=%s "$RANGE" | npx --no -- commitlint

  verify:
    name: Lint y typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:catalogo
      - run: npm run test:panel
      - name: Instalar compiladores para los cursos Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran build-essential
      - run: npm run test:fortran
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fortran:web
