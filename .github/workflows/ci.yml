name: Promoción dev → qa → main

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: promocion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev:
    name: Validar dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar mensajes de commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            BASE_SHA="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git fetch origin main
            BASE_SHA="$(git merge-base origin/main HEAD)"
          else
            BASE_SHA="$BEFORE_SHA"
          fi
          git log --format=%s "$BASE_SHA..HEAD" | npx --no -- commitlint
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:marca
      - run: npm run test:catalogo
      - run: npm run test:panel

  qa:
    name: Compilar y probar para qa
    if: github.event_name == 'push'
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instalar compiladores para los cursos Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran build-essential
      - run: npm run test:fortran
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fortran:web

  promover-qa:
    name: Promover el commit verificado a qa
    if: github.event_name == 'push'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Avanzar qa solo por fast-forward
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git fetch origin qa
          git merge-base --is-ancestor origin/qa "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/qa"

  promover-main:
    name: Promover el mismo commit de qa a main
    if: github.event_name == 'push'
    needs: promover-qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Avanzar main solo desde qa por fast-forward
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git fetch origin qa main
          test "$(git rev-parse origin/qa)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/main"
